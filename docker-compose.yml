services:
  bot:
    build: .
    image: cobalt-telegram-bot:latest
    container_name: cobalt-bot
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      # The list from .env wins; the bundled instance is the default.
      COBALT_API_URL: "${COBALT_API_URL:-http://cobalt:9000}"
    depends_on:
      cobalt:
        condition: service_started
      telegram-bot-api:
        condition: service_started
        # Only present when the local-api profile is enabled.
        required: false
    # Downloads, muxing and thumbnails live in a tmpfs: nothing hits the disk.
    tmpfs:
      - /tmp:size=4g

  # Serves everything except YouTube — that goes through yt-dlp inside the bot,
  # which fetches its own tokens and needs no session server.
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    container_name: cobalt
    init: true
    read_only: true
    restart: unless-stopped
    environment:
      # Must match the URL the bot uses: tunnel links are built from it.
      API_URL: "http://cobalt:9000/"
      # Cobalt refuses anything longer than this (seconds). 3 hours by default.
      DURATION_LIMIT: "10800"
      # Tunnel links must stay alive long enough for a slow upload to Telegram.
      TUNNEL_LIFESPAN: "1800"
    expose:
      - "9000"
    # Uncomment to reach the API from the host (debugging only):
    # ports:
    #   - "127.0.0.1:9000:9000"

  # Optional: lifts the upload limit from 50 MB to 2000 MB.
  # Enable with:  docker compose --profile local-api up -d
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH from https://my.telegram.org/apps
  # and a one-time logout from the cloud API: python -m app.logout --yes
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    profiles: ["local-api"]
    init: true
    restart: unless-stopped
    environment:
      # Both come from https://my.telegram.org/apps; the server refuses to
      # start without them. Kept optional here so `docker compose config`
      # keeps working when this profile is not enabled.
      TELEGRAM_API_ID: "${TELEGRAM_API_ID:-}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH:-}"
      TELEGRAM_LOCAL: "1"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    expose:
      - "8081"

volumes:
  telegram-bot-api-data:
